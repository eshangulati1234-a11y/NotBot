[project]
name = "notbot-harness"
version = "0.1.0"
description = "Local-first LangGraph agent runtime for Notbot."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.22,<2",
    "langchain>=1.5,<2",
    "langchain-core>=1.8.2,<2",
    "langchain-openai>=1,<2",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
    "pydantic>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "platformdirs>=4,<5",
    "filelock>=4.2.1,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "pip-audit>=2.9,<3", "pyinstaller>=6.22,<7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
