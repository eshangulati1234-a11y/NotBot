services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8088:8080'
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Generate a local SEARXNG_SECRET first}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml
      - cache:/var/cache/searxng
volumes:
  cache:
